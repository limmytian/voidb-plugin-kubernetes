[capabilities.session_handoff.live_session]
protocol_version = 1
start_risk = "external_side_effect"

[capabilities.session_handoff.live_session.kind]
kind = "exec"

[capabilities.session_handoff.live_session.resource]
resource_type = "kubernetes_pod_container"
identity_fields = [
    "/namespace",
    "/pod",
    "/container",
]
audit_identity = "fingerprint"

[capabilities.session_handoff.live_session.resource.identity_schema]
additionalProperties = false
required = [
    "namespace",
    "pod",
    "container",
]
type = "object"

[capabilities.session_handoff.live_session.resource.identity_schema.properties.container]
maxLength = 253
minLength = 1
type = "string"

[capabilities.session_handoff.live_session.resource.identity_schema.properties.namespace]
maxLength = 253
minLength = 1
type = "string"

[capabilities.session_handoff.live_session.resource.identity_schema.properties.pod]
maxLength = 253
minLength = 1
type = "string"

[capabilities.session_handoff.live_session.start_parameters_schema]
additionalProperties = false
required = ["command"]
type = "object"

[capabilities.session_handoff.live_session.start_parameters_schema.properties.cols]
default = 120
maximum = 500
minimum = 20
type = "integer"

[capabilities.session_handoff.live_session.start_parameters_schema.properties.command]
maxItems = 64
minItems = 1
type = "array"

[capabilities.session_handoff.live_session.start_parameters_schema.properties.command.items]
maxLength = 4096
minLength = 1
type = "string"

[capabilities.session_handoff.live_session.start_parameters_schema.properties.rows]
default = 40
maximum = 200
minimum = 5
type = "integer"

[capabilities.session_handoff.live_session.start_parameters_schema.properties.tty]
default = true
type = "boolean"

[capabilities.session_handoff.live_session.event_schema]
maxProperties = 20
type = "object"

[capabilities.session_handoff.live_session.operations]
events = "kubernetes.exec_read"
input = "kubernetes.exec_input"
resize = "kubernetes.exec_resize"

[capabilities.session_handoff.live_session.buffer]
max_events = 1000
max_bytes = 1048576
overflow = "drop_oldest"

[capabilities.session_handoff.live_session.reconnect]
mode = "never"
max_attempts = 0
initial_backoff_ms = 0
max_backoff_ms = 0
resume = "unsupported"

[capabilities.session_handoff.live_session.delivery]
backpressure = "bounded_buffer"
cursor_scope = "optional"
max_read_wait_ms = 30000

[capabilities.session_handoff.live_session.delivery.heartbeat]

[capabilities.session_handoff.live_session.control]
cancel = "call_only"
close = "terminate_remote"

[[capabilities]]
