id = "kubernetes"
name = "Kubernetes Cluster Management Plugin"
version = "0.3.0"
protocol_version = "1"
description = "Kubernetes cluster and workload management plugin for VoidB."
license = "Apache-2.0"
homepage = "https://github.com/limmytian/voidb-plugin-kubernetes"

[runtime]
command = "voidb-plugin-kubernetes"
args = ["serve"]
transport = "stdio-jsonrpc"

[connections]
profile_schema = "schemas/profile.schema.json"
secret_classes = ["token", "client_certificate"]

[[capabilities]]
id = "diagnostics"
description = "Return agent-safe Kubernetes profile diagnostics without opening a cluster connection."
input_schema = "schemas/diagnostics-input.schema.json"
output_schema = "schemas/diagnostics-output.schema.json"
permissions = ["connection.read", "kubernetes.diagnostics"]
risk = "read_only"
destructive = false
streaming = false
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[[capabilities]]
id = "contexts"
description = "List kubeconfig contexts without connecting to the cluster."
input_schema = "schemas/contexts-input.schema.json"
output_schema = "schemas/contexts-output.schema.json"
permissions = ["connection.read", "kubernetes.contexts"]
risk = "read_only"
destructive = false
streaming = false
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[[capabilities]]
id = "namespaces"
description = "List Kubernetes namespaces."
input_schema = "schemas/namespaces-input.schema.json"
output_schema = "schemas/namespaces-output.schema.json"
permissions = ["connection.read", "kubernetes.namespaces"]
risk = "read_only"
destructive = false
streaming = false
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[[capabilities]]
id = "list"
description = "List Kubernetes resources with bounded, cursor-based output."
input_schema = "schemas/list-input.schema.json"
output_schema = "schemas/list-output.schema.json"
permissions = ["connection.read", "kubernetes.resources.list"]
risk = "read_only"
destructive = false
streaming = false
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[[capabilities]]
id = "get_yaml"
description = "Get one Kubernetes resource as bounded YAML; Secret payloads are not exposed."
input_schema = "schemas/get_yaml-input.schema.json"
output_schema = "schemas/get_yaml-output.schema.json"
permissions = ["connection.read", "kubernetes.resources.get"]
risk = "read_only"
destructive = false
streaming = false
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[[capabilities]]
id = "logs"
description = "Read bounded pod logs without following the stream."
input_schema = "schemas/logs-input.schema.json"
output_schema = "schemas/logs-output.schema.json"
permissions = ["connection.read", "kubernetes.pods.logs"]
risk = "read_only"
destructive = false
streaming = false
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[[capabilities]]
id = "watch_events"
description = "Watch one namespaced or cluster-scoped Kubernetes API resource with resource-version continuation."
input_schema = "schemas/watch_events-input.schema.json"
output_schema = "schemas/watch_events-output.schema.json"
permissions = ["connection.read", "kubernetes.resources.watch"]
risk = "read_only"
destructive = false
streaming = true
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[[capabilities]]
id = "logs_follow"
description = "Follow one explicit pod container log stream with bounded retention."
input_schema = "schemas/logs_follow-input.schema.json"
output_schema = "schemas/logs_follow-output.schema.json"
permissions = ["connection.read", "kubernetes.pods.logs"]
risk = "read_only"
destructive = false
streaming = true
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[[capabilities]]
id = "exec_read"
description = "Read output from one explicitly configured Kubernetes pod exec."
input_schema = "schemas/exec_read-input.schema.json"
output_schema = "schemas/exec_read-output.schema.json"
permissions = ["connection.read", "kubernetes.pods.exec"]
risk = "read_only"
destructive = false
streaming = true
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[[capabilities]]
id = "exec_input"
description = "Write bounded text to one controlled Kubernetes pod exec."
input_schema = "schemas/exec_input-input.schema.json"
output_schema = "schemas/exec_input-output.schema.json"
permissions = ["connection.write", "kubernetes.pods.exec"]
risk = "external_side_effect"
destructive = false
streaming = false
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[[capabilities]]
id = "exec_resize"
description = "Resize one controlled Kubernetes pod exec TTY."
input_schema = "schemas/exec_resize-input.schema.json"
output_schema = "schemas/exec_resize-output.schema.json"
permissions = ["connection.write", "kubernetes.pods.exec"]
risk = "external_side_effect"
destructive = false
streaming = false
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[[capabilities]]
id = "port_forward_events"
description = "Open one loopback-only pod port forward and report bounded connection state."
input_schema = "schemas/port_forward_events-input.schema.json"
output_schema = "schemas/port_forward_events-output.schema.json"
permissions = ["connection.write", "kubernetes.pods.port_forward"]
risk = "read_only"
destructive = false
streaming = true
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[[capabilities]]
id = "delete"
description = "Delete one namespaced Kubernetes resource."
input_schema = "schemas/delete-input.schema.json"
output_schema = "schemas/delete-output.schema.json"
permissions = ["connection.write", "kubernetes.resources.delete"]
risk = "destructive"
destructive = true
streaming = false
connection_required = true
required_secret_classes = []
supports_dry_run = true
default_timeout_ms = 30000

[[capabilities]]
id = "scale"
description = "Scale a Kubernetes deployment to a requested replica count."
input_schema = "schemas/scale-input.schema.json"
output_schema = "schemas/scale-output.schema.json"
permissions = ["connection.write", "kubernetes.deployments.scale"]
risk = "destructive"
destructive = true
streaming = false
connection_required = true
required_secret_classes = []
supports_dry_run = true
default_timeout_ms = 30000

[[capabilities]]
id = "restart"
description = "Trigger a Kubernetes deployment rollout restart."
input_schema = "schemas/restart-input.schema.json"
output_schema = "schemas/restart-output.schema.json"
permissions = ["connection.write", "kubernetes.deployments.restart"]
risk = "destructive"
destructive = true
streaming = false
connection_required = true
required_secret_classes = []
supports_dry_run = true
default_timeout_ms = 30000

[[capabilities]]
id = "apply"
description = "Apply one Kubernetes YAML manifest."
input_schema = "schemas/apply-input.schema.json"
output_schema = "schemas/apply-output.schema.json"
permissions = ["connection.write", "kubernetes.resources.apply"]
risk = "destructive"
destructive = true
streaming = false
connection_required = true
required_secret_classes = []
supports_dry_run = true
default_timeout_ms = 30000

[ui]
tui = true

[requirements]
voidb_core = ">=0.1.0"
platforms = ["darwin", "linux", "windows"]
