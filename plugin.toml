id = "kubernetes"
name = "Kubernetes Cluster Management Plugin"
version = "0.3.4"
protocol_version = "1"
description = "Kubernetes cluster and workload management plugin for VoidB."
license = "Apache-2.0"
homepage = "https://github.com/limmytian/voidb-plugin-kubernetes"

[runtime]
command = "voidb-plugin-kubernetes"
args = ["serve"]
transport = "stdio-jsonrpc"

[runtime.env]

[connections]
profile_schema = "schemas/profile.schema.json"
secret_classes = [
    "token",
    "client_certificate",
]

[[capabilities]]
id = "diagnostics"
description = "Return agent-safe Kubernetes profile diagnostics without opening a cluster connection."
input_schema = "schemas/diagnostics-input.schema.json"
output_schema = "schemas/diagnostics-output.schema.json"
permissions = [
    "connection.read",
    "kubernetes.diagnostics",
]
risk = "read_only"
destructive = false
streaming = false
execution_mode = "stateless"
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[capabilities.authorization]
declared = true
interactive_execute = false
session_purposes = []
capability_wide_allowed = true

[[capabilities]]
id = "contexts"
description = "List kubeconfig contexts without connecting to the cluster."
input_schema = "schemas/contexts-input.schema.json"
