[capabilities.session_handoff.live_session.resource]
resource_type = "kubernetes_api_resource"
identity_fields = [
    "/api_version",
    "/kind",
    "/plural",
]
audit_identity = "fingerprint"

[capabilities.session_handoff.live_session.resource.identity_schema]
additionalProperties = false
required = [
    "api_version",
    "kind",
    "plural",
]
type = "object"

[capabilities.session_handoff.live_session.resource.identity_schema.properties.api_version]
maxLength = 256
minLength = 1
type = "string"

[capabilities.session_handoff.live_session.resource.identity_schema.properties.kind]
maxLength = 128
minLength = 1
type = "string"

[capabilities.session_handoff.live_session.resource.identity_schema.properties.namespace]
maxLength = 253
minLength = 1
type = "string"

[capabilities.session_handoff.live_session.resource.identity_schema.properties.plural]
maxLength = 128
minLength = 1
type = "string"

[capabilities.session_handoff.live_session.start_parameters_schema]
additionalProperties = false
type = "object"

[capabilities.session_handoff.live_session.start_parameters_schema.properties.field_selector]
maxLength = 1024
type = "string"

[capabilities.session_handoff.live_session.start_parameters_schema.properties.label_selector]
maxLength = 1024
type = "string"

[capabilities.session_handoff.live_session.event_schema]
maxProperties = 20
type = "object"

[capabilities.session_handoff.live_session.operations]
events = "kubernetes.watch_events"

[capabilities.session_handoff.live_session.buffer]
max_events = 2000
max_bytes = 2097152
overflow = "drop_oldest"

[capabilities.session_handoff.live_session.reconnect]
mode = "transient"
max_attempts = 32
initial_backoff_ms = 250
max_backoff_ms = 10000
resume = "exact_cursor"
cursor_kind = "resource_version"

[capabilities.session_handoff.live_session.delivery]
backpressure = "bounded_buffer"
cursor_scope = "optional"
max_read_wait_ms = 30000

[capabilities.session_handoff.live_session.delivery.heartbeat]

[capabilities.session_handoff.live_session.control]
cancel = "call_only"
close = "stop_observation"

