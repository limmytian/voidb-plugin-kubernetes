[package]
name = "voidb-plugin-kubernetes"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
authors = ["limmytian <limmytian@gmail.com>"]
description = "Standalone VoidB process plugin for Kubernetes cluster management"
repository = "https://github.com/limmytian/voidb-plugin-kubernetes"

[[bin]]
name = "voidb-plugin-kubernetes"
path = "src/main.rs"

[dependencies]
voidb-process-plugin-sdk = { git = "https://github.com/limmytian/voidb.git", tag = "v0.3.0-rc.1" }
voidb-core = { git = "https://github.com/limmytian/voidb.git", tag = "v0.3.0-rc.1" }
kube = { version = "0.99", features = ["client", "config", "ws", "rustls-tls"] }
k8s-openapi = { version = "0.24", features = ["v1_32"], default-features = false }
async-trait = "0.1"
anyhow = "1.0"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
pem = "3"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
base64 = "0.22"
http = "1"
ratatui = "0.29"
crossterm = "0.28"
dirs = "6.0"

[dev-dependencies]
uuid = { version = "1.13", features = ["v4"] }

[[example]]
name = "export_schemas"
path = "examples/export_schemas.rs"

[[example]]
name = "fixture_smoke"
path = "examples/fixture_smoke.rs"
